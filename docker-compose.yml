services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: influencers_crm
    ports:
      - "5432:5432"
    volumes:
      - influencers_crm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d influencers_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  influencers_crm_pg:
